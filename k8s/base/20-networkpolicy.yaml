# Mặc định deny toàn bộ ingress trong namespace, rồi mở đúng luồng cần thiết.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: babymilk
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# frontend: nhận traffic từ ngoài (NodePort) -> không cần policy ingress riêng vì
# NodePort traffic đi qua kube-proxy/cilium trước khi tới pod, nhưng để rõ ràng vẫn khai báo mở toàn bộ.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-frontend
  namespace: babymilk
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - {}
---
# user-service: chỉ nhận request từ frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-user
  namespace: babymilk
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 4002
---
# order-service: chỉ nhận request từ frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-order
  namespace: babymilk
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 4003
---
# notification-service: chỉ nhận request từ frontend (GET /api/notifications, admin)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-notification
  namespace: babymilk
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 4004
---
# postgres: 4 backend service được kết nối (product/user/order/notification), frontend KHÔNG được.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-to-postgres
  namespace: babymilk
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: product-service
    - podSelector:
        matchLabels:
          app: user-service
    - podSelector:
        matchLabels:
          app: order-service
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - port: 5432
---
# redis: chỉ order-service (publish) và notification-service (subscribe) được kết nối.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-notification-to-redis
  namespace: babymilk
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: order-service
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - port: 6379
---
# product-service: KHÔNG dùng NetworkPolicy L3/L4 riêng ở đây — chỉ dùng CiliumNetworkPolicy (L7) bên dưới.
# Lý do: Cilium cộng dồn (OR) nhiều policy cùng chọn 1 pod — nếu có thêm policy L3/L4 cho phép
# nguyên port 4001, nó sẽ "mở khoá" luôn cả /internal/*, vô hiệu hoá giới hạn L7 phía dưới.
# CiliumNetworkPolicy (L7 HTTP-aware) - đây là điểm khác biệt Cilium so với Calico OSS:
# /internal/* trên product-service CHỈ order-service được gọi, frontend chỉ được gọi /api/*.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: product-internal-l7
  namespace: babymilk
spec:
  endpointSelector:
    matchLabels:
      app: product-service
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: order-service
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "POST"
          path: "/internal/.*"
  - fromEndpoints:
    - matchLabels:
        app: frontend
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/api/.*"
        - method: "POST"
          path: "/api/.*"
        - method: "PUT"
          path: "/api/.*"
        - method: "PATCH"
          path: "/api/.*"
        - method: "DELETE"
          path: "/api/.*"
  # Lab 1.3: CronJob "stock-monitor" cần đọc /api/products để cảnh báo tồn kho thấp.
  # Consumer mới -> phải xin quyền tường minh, chỉ cho GET (không cho sửa/xoá).
  - fromEndpoints:
    - matchLabels:
        app: stock-monitor
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/api/.*"
  # 80-ingress.yaml: route thẳng /api/products -> product-service (không qua frontend gateway),
  # đúng yêu cầu Ingress phải có ≥2 path/host tới backend KHÁC NHAU. ingress-nginx chạy ở
  # namespace khác (ingress-nginx) -> phải khai namespace qua nhãn dành riêng k8s:io.kubernetes.pod.namespace
  # (cú pháp Cilium cho fromEndpoints xuyên namespace). CHỈ cho GET, không cho sửa/xoá qua đường tắt này.
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: ingress-nginx
        app.kubernetes.io/name: ingress-nginx
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/api/.*"
