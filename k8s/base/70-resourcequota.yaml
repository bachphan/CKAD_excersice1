# Lab 3.4 — Namespace Quotas. Size dựa trên tổng requests/limits thực tế đang dùng + margin đủ cho
# HPA scale product-service tới 3 pod, rolling update tạm surge thêm 1 pod, CronJob "stock-monitor"
# spawn Job ngắn hạn — vẫn nằm trong ngân sách node thật (~1.9 CPU/3.2GB). Nâng từ 1200/1600/1800/
# 2800 lên mức này khi thêm redis + notification-service (5 microservice thay vì 4).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: babymilk-quota
  namespace: babymilk
spec:
  hard:
    requests.cpu: "1400m"
    requests.memory: "1800Mi"
    limits.cpu: "2200m"
    limits.memory: "3200Mi"
    pods: "20"
    persistentvolumeclaims: "3"
