# 1 Postgres instance dùng chung, 3 database logic riêng cho 3 service (đúng tinh thần
# "database-per-service" của microservices, tiết kiệm tài nguyên hơn 3 Postgres riêng biệt
# — phù hợp ngân sách 1 node worker ~1.9 CPU/3.2GB).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: babymilk
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    for db in babymilk_products babymilk_users babymilk_orders babymilk_notifications; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE $db;
    EOSQL
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: babymilk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PGUSER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: babymilk-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "babymilk"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "babymilk"]
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data-pvc
      - name: init-script
        configMap:
          name: postgres-init
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: babymilk
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
