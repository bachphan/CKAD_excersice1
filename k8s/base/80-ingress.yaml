# Ingress qua ingress-nginx (cài riêng như add-on cluster, KHÔNG quản lý qua Kustomize —
# xem README.md mục "Môi trường hạ tầng", giống metrics-server/local-path-provisioner).
# Đã thử Cilium's built-in Ingress Controller 2 lần, cả 2 lần đều dính bug thật của Cilium 1.19.x
# (agent kẹt khi restart cùng kube-proxy — xem lab/lab_4.2.txt) -> chuyển sang ingress-nginx, tách
# biệt hoàn toàn khỏi CNI agent, không đụng lại vấn đề đó.
# NodePort (Service frontend, :30080) vẫn là đường truy cập CHÍNH — Ingress này là thêm 1 đường
# vào song song (qua domain "babymilk.local", cần khai trong /etc/hosts hoặc DNS nội bộ để dùng thật).
#
# 2 path route tới 2 Service KHÁC NHAU (minh hoạ path-based routing thật của Ingress, không chỉ
# 1 backend duy nhất):
#   /api/products  -> product-service thẳng (bỏ qua frontend gateway) — chỉ GET, xem CiliumNetworkPolicy
#                     product-internal-l7 (20-networkpolicy.yaml) đã mở quyền riêng cho ingress-nginx
#   /              -> frontend (gateway + static site) — catch-all, giữ nguyên hành vi cũ
# nginx tự ưu tiên path CỤ THỂ HƠN (/api/products) trước path chung (/), không phụ thuộc thứ tự khai.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: babymilk-ingress
  namespace: babymilk
spec:
  ingressClassName: nginx
  rules:
  - host: babymilk.local
    http:
      paths:
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 4001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4000
