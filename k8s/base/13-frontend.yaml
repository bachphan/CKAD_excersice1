apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: babymilk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-config
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - |
            echo "== frontend effective config ==" > /init-config/summary.txt
            echo "PRODUCT_SERVICE_URL=$PRODUCT_SERVICE_URL" >> /init-config/summary.txt
            echo "USER_SERVICE_URL=$USER_SERVICE_URL" >> /init-config/summary.txt
            echo "ORDER_SERVICE_URL=$ORDER_SERVICE_URL" >> /init-config/summary.txt
            cat /init-config/summary.txt
        env:
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PRODUCT_SERVICE_URL
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: USER_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: ORDER_SERVICE_URL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: init-config-data
          mountPath: /init-config
      containers:
      - name: frontend
        image: docker.io/babymilk/frontend:1.2
        imagePullPolicy: Never
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 4100
        volumeMounts:
        - name: init-config-data
          mountPath: /init-config
          readOnly: true
        env:
        - name: PORT
          value: "4100"
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PRODUCT_SERVICE_URL
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: USER_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: ORDER_SERVICE_URL
        - name: UPSTREAM_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: UPSTREAM_TIMEOUT_MS
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4100
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4100
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
      - name: log-shipper
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command: ["sh", "-c"]
        args:
          - |
            until ls /var/log/containers/${POD_NAME}_babymilk_frontend-*.log 1>/dev/null 2>&1; do sleep 2; done
            exec tail -F /var/log/containers/${POD_NAME}_babymilk_frontend-*.log
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      - name: ambassador-nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: ambassador-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: frontend.conf
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: init-config-data
        emptyDir: {}
      - name: varlog
        hostPath:
          path: /var/log
      - name: ambassador-conf
        configMap:
          name: ambassador-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: babymilk
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30080
