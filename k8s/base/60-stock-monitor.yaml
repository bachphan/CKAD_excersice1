# Lab 1.3 — Jobs & CronJobs: tính năng thật "cảnh báo tồn kho thấp" cho BabyMilk Shop.
#
# CronJob: tự động tạo Job mới theo lịch (mỗi ngày 8h sáng). Mỗi lần tới giờ, CronJob tự sinh 1 Job
# con độc lập (khác Deployment: Deployment giữ pod LUÔN chạy, Job coi thành công 1 lần là XONG việc).
#
# (Job thử nghiệm 1 lần "stock-check-manual" dùng để test logic trước khi lên lịch không nằm trong
#  base — đó là thao tác ad-hoc, xem lab/lab_1.3.txt để chạy lại khi cần test tay.)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-monitor
  namespace: babymilk
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: stock-monitor
        spec:
          restartPolicy: OnFailure
          containers:
          - name: stock-check
            image: busybox:1.36
            command:
            - sh
            - -c
            - |
              echo "=== Scheduled stock check $(date) ==="
              wget -qO- http://product-service:4001/api/products?limit=100 > /tmp/products.json || exit 1
              grep -o '"name":"[^"]*","brand":"[^"]*"[^}]*"stock":[0-9]\{1,2\}[,}]' /tmp/products.json | head -20
              echo "=== Done ==="
            resources:
              requests:
                cpu: 20m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 32Mi
