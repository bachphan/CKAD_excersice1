# Dynamic provisioning qua local-path-provisioner — KHÔNG dùng chung static PV
# "postgres-data-pv" (hostPath) mà bản Kustomize/prod đang giữ, tránh đụng độ.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storageSize }}
