# Đổi giá trị mặc định trong values.yaml (hoặc truyền -f values-secret.yaml / --set)
# trước khi deploy lên môi trường thật — không dùng REPLACE_ME_* ngoài lab.
apiVersion: v1
kind: Secret
metadata:
  name: babymilk-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INTERNAL_API_KEY: {{ .Values.secrets.internalApiKey | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
