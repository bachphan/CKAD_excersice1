apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-config
        image: {{ .Values.images.busybox }}
        imagePullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - |
            echo "== product-service effective config ==" > /init-config/summary.txt
            echo "PGHOST=$PGHOST" >> /init-config/summary.txt
            echo "PGPORT=$PGPORT" >> /init-config/summary.txt
            echo "PGDATABASE=babymilk_products" >> /init-config/summary.txt
            echo "SEED_ON_START=$SEED_ON_START" >> /init-config/summary.txt
            cat /init-config/summary.txt
        env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PGHOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PGPORT
        - name: SEED_ON_START
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: SEED_ON_START
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: init-config-data
          mountPath: /init-config
      containers:
      - name: product-service
        image: {{ .Values.images.productService }}
        imagePullPolicy: Never
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 4101
        volumeMounts:
        - name: init-config-data
          mountPath: /init-config
          readOnly: true
        env:
        - name: PORT
          value: "4101"
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PGHOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PGPORT
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PGUSER
        - name: PGDATABASE
          value: "babymilk_products"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: babymilk-secret
              key: POSTGRES_PASSWORD
        - name: SEED_ON_START
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: SEED_ON_START
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: babymilk-secret
              key: JWT_SECRET
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: babymilk-secret
              key: INTERNAL_API_KEY
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4101
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4101
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
      - name: log-shipper
        image: {{ .Values.images.busybox }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command: ["sh", "-c"]
        args:
          - |
            until ls /var/log/containers/${POD_NAME}_{{ .Values.namespace }}_product-service-*.log 1>/dev/null 2>&1; do sleep 2; done
            exec tail -F /var/log/containers/${POD_NAME}_{{ .Values.namespace }}_product-service-*.log
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      - name: ambassador-nginx
        image: {{ .Values.images.nginx }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 4001
        volumeMounts:
        - name: ambassador-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: product-service.conf
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: init-config-data
        emptyDir: {}
      - name: varlog
        hostPath:
          path: /var/log
      - name: ambassador-conf
        configMap:
          name: ambassador-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: product-service
  ports:
  - port: 4001
    targetPort: 4001
