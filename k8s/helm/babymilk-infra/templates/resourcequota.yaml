apiVersion: v1
kind: ResourceQuota
metadata:
  name: babymilk-quota
  namespace: {{ .Values.namespace }}
spec:
  hard:
    requests.cpu: {{ .Values.resourceQuota.requestsCpu | quote }}
    requests.memory: {{ .Values.resourceQuota.requestsMemory | quote }}
    limits.cpu: {{ .Values.resourceQuota.limitsCpu | quote }}
    limits.memory: {{ .Values.resourceQuota.limitsMemory | quote }}
    pods: "20"
    persistentvolumeclaims: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: babymilk-limits
  namespace: {{ .Values.namespace }}
spec:
  limits:
  - type: Container
    default:
      cpu: "150m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    min:
      cpu: "10m"
      memory: "16Mi"
    max:
      cpu: "500m"
      memory: "512Mi"
