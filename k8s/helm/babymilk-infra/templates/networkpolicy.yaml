apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-user
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 4002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-order
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 4003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-notification
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 4004
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-to-postgres
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: product-service
    - podSelector:
        matchLabels:
          app: user-service
    - podSelector:
        matchLabels:
          app: order-service
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-notification-to-redis
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: order-service
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - port: 6379
---
# product-service: KHÔNG dùng NetworkPolicy L3/L4 riêng — chỉ CiliumNetworkPolicy (L7) bên dưới
# (Cilium cộng dồn OR nhiều policy cùng chọn 1 pod, thêm L3/L4 sẽ vô hiệu hoá giới hạn L7).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: product-internal-l7
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: product-service
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: order-service
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "POST"
          path: "/internal/.*"
  - fromEndpoints:
    - matchLabels:
        app: frontend
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/api/.*"
        - method: "POST"
          path: "/api/.*"
        - method: "PUT"
          path: "/api/.*"
        - method: "PATCH"
          path: "/api/.*"
        - method: "DELETE"
          path: "/api/.*"
  - fromEndpoints:
    - matchLabels:
        app: stock-monitor
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/api/.*"
  # ingress-nginx (namespace khác) gọi thẳng /api/products qua Ingress — xem templates/ingress.yaml
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: ingress-nginx
        app.kubernetes.io/name: ingress-nginx
    toPorts:
    - ports:
      - port: "4001"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/api/.*"
---
# Cho phép init container RBAC của stock-monitor gọi kube-apiserver (hostNetwork, phải dùng
# toEntities — xem k8s/CONVENTIONS.md mục 8).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-stock-monitor-egress-apiserver
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: stock-monitor
  egress:
  - toEntities:
    - kube-apiserver
---
# ---- Egress (Lab 4.3) ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-backends
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: product-service
    ports:
    - port: 4001
  - to:
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - port: 4002
  - to:
    - podSelector:
        matchLabels:
          app: order-service
    ports:
    - port: 4003
  - to:
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - port: 4004
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-egress-to-postgres
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: ["product-service", "user-service", "order-service", "notification-service"]
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-egress-to-product
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: product-service
    ports:
    - port: 4001
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-egress-to-redis
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stock-monitor-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: stock-monitor
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: product-service
    ports:
    - port: 4001
