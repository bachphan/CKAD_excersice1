apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: babymilk-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 4001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4000
