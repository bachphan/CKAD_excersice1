# Đổi giá trị mặc định trong values.yaml (hoặc truyền -f values-secret.yaml / --set) trước khi
# deploy lên môi trường thật — không dùng REPLACE_ME_* ngoài lab.
# Nếu secrets.manage=false, chart này KHÔNG tạo/ghi đè Secret — dùng khi muốn giữ nguyên Secret
# đã tồn tại sẵn trong namespace (vd. cutover từ Kustomize sang Helm mà không đổi giá trị bí mật).
{{- if .Values.secrets.manage }}
apiVersion: v1
kind: Secret
metadata:
  name: babymilk-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INTERNAL_API_KEY: {{ .Values.secrets.internalApiKey | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
