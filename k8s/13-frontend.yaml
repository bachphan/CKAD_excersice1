apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: babymilk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: docker.io/babymilk/frontend:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: PRODUCT_SERVICE_URL
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: USER_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: ORDER_SERVICE_URL
        - name: UPSTREAM_TIMEOUT_MS
          valueFrom:
            configMapKeyRef:
              name: babymilk-config
              key: UPSTREAM_TIMEOUT_MS
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: babymilk
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30080
